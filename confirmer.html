<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal — Confirmer mon compte</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #FAF6EE; color: #222; }
    header { background: #16213E; color: white; padding: 15px 25px; }
    header a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    .conteneur { max-width: 400px; margin: 40px auto; background: white; padding: 24px; border-radius: 10px; border: 1px solid #ddd; }
    h2 { margin-top: 0; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 14px; }
    input { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    button { width: 100%; background: #16213E; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .message { font-size: 0.9rem; font-weight: bold; min-height: 20px; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html">MarketSenegal</a>
  </header>

  <div class="conteneur">
    <h2>Confirmer mon compte</h2>
    <p>Connecte-toi et entre le code reçu par email.</p>
    <form id="form-confirmer">
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Mot de passe
        <input type="password" name="motdepasse" required>
      </label>
      <label>Code de confirmation (6 chiffres)
        <input type="text" name="code" required maxlength="6">
      </label>
      <button type="submit">Confirmer</button>
    </form>
    <p class="message" id="message-confirmer"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    document.getElementById("form-confirmer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const messageEl = document.getElementById("message-confirmer");
      messageEl.style.color = "#222";
      messageEl.textContent = "Vérification...";

      try {
        const resultat = await auth.signInWithEmailAndPassword(form.email.value, form.motdepasse.value);
        const doc = await db.collection("vendeurs").doc(resultat.user.uid).get();
        const data = doc.data();

        if (!data || data.statut !== "code_envoye") {
          messageEl.style.color = "#D6336C";
          messageEl.textContent = "Aucun code en attente pour ce compte.";
          return;
        }

        if (form.code.value.trim() !== data.codeConfirmation) {
          messageEl.style.color = "#D6336C";
          messageEl.textContent = "Code incorrect.";
          return;
        }

        await db.collection("vendeurs").doc(resultat.user.uid).update({
          statut: "valide",
          codeConfirmation: firebase.firestore.FieldValue.delete(),
        });

        messageEl.style.color = "green";
        messageEl.textContent = "Compte confirmé ! Redirection...";
        setTimeout(() => (window.location.href = "espace-vendeur.html"), 1500);
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : email/mot de passe incorrect.";
      }
    });
  </script>

</body>
</html>
