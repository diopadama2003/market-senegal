<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #FAF6EE; color: #222; }
    header { background: #16213E; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    .nav-liens { display: flex; gap: 16px; align-items: center; }
    .nav-liens a { color: white; text-decoration: none; font-size: 0.9rem; }
    .nav-liens a:hover { text-decoration: underline; }
    #btn-deconnexion { background: none; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .conteneur { max-width: 600px; margin: 30px auto; padding: 0 16px; }
    .carte { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; max-width: 380px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 14px; }
    input { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    button { background: #16213E; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .message { font-size: 0.9rem; font-weight: bold; min-height: 20px; }
    .titre-section { margin-top: 30px; }
    .ligne { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ligne button { background: #D6336C; padding: 5px 10px; font-size: 0.8rem; }
    .ligne button.accepter { background: #0B6E6E; }
    .ligne button.refuser { background: #888; }
    .statut-attente { color: #D98A0E; font-weight: bold; }
    .statut-valide { color: green; font-weight: bold; }
    .statut-refuse { color: #D6336C; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <a href="index.html">MarketSenegal</a>
    <nav class="nav-liens">
      <a href="index.html">Accueil</a>
      <a href="vendeur.html">Devenir vendeur</a>
    </nav>
    <button id="btn-deconnexion" style="display:none;">Se déconnecter</button>
  </header>

  <div class="conteneur">

    <div id="bloc-connexion" class="carte">
      <h2>Connexion admin</h2>
      <form id="form-connexion">
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Mot de passe
          <input type="password" name="motdepasse" required>
        </label>
        <button type="submit">Se connecter</button>
      </form>
      <p class="message" id="message-connexion"></p>
    </div>

    <div id="bloc-admin" style="display:none;">
      <h2>Tableau de bord</h2>
      <p id="message-action" class="message"></p>

      <h3 class="titre-section">Vendeurs (<span id="nb-vendeurs">0</span>)</h3>
      <div id="liste-vendeurs"></div>

      <h3 class="titre-section">Produits publiés (<span id="nb-produits">0</span>)</h3>
      <div id="liste-produits-admin"></div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    emailjs.init("tulYYMgHIeGkicpqU");

    const blocConnexion = document.getElementById("bloc-connexion");
    const blocAdmin = document.getElementById("bloc-admin");
    const btnDeconnexion = document.getElementById("btn-deconnexion");

    document.getElementById("form-connexion").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const messageEl = document.getElementById("message-connexion");
      try {
        await auth.signInWithEmailAndPassword(form.email.value, form.motdepasse.value);
      } catch (err) {
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Email ou mot de passe incorrect.";
      }
    });

    btnDeconnexion.addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged((user) => {
      if (user && user.uid === ADMIN_UID) {
        blocConnexion.style.display = "none";
        blocAdmin.style.display = "block";
        btnDeconnexion.style.display = "inline-block";
        chargerVendeurs();
        chargerProduits();
        verifierLienAcceptation();
      } else if (user && user.uid !== ADMIN_UID) {
        alert("Ce compte n'est pas administrateur.");
        auth.signOut();
      } else {
        blocConnexion.style.display = "block";
        blocAdmin.style.display = "none";
        btnDeconnexion.style.display = "none";
      }
    });

    function verifierLienAcceptation() {
      const params = new URLSearchParams(window.location.search);
      const uidAAccepter = params.get("accepter");
      if (uidAAccepter) {
        accepterVendeur(uidAAccepter);
      }
    }

    async function accepterVendeur(uid) {
      const messageEl = document.getElementById("message-action");
      messageEl.style.color = "#222";
      messageEl.textContent = "Validation en cours...";

      try {
        const doc = await db.collection("vendeurs").doc(uid).get();
        if (!doc.exists) {
          messageEl.style.color = "#D6336C";
          messageEl.textContent = "Vendeur introuvable.";
          return;
        }
        const data = doc.data();
        const code = String(Math.floor(100000 + Math.random() * 900000));

        await db.collection("vendeurs").doc(uid).update({
          statut: "code_envoye",
          codeConfirmation: code,
        });

        await emailjs.send("service_wkkglfl", "template_k5wz66g", {
          nom_vendeur: data.nomVendeur,
          email_vendeur: data.email,
          code: code,
        });

        messageEl.style.color = "green";
        messageEl.textContent = `Vendeur "${data.nomVendeur}" accepté, code envoyé !`;
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      }
    }

    async function refuserVendeur(uid) {
      if (!confirm("Refuser ce vendeur ? Il ne pourra pas publier de produits.")) return;
      const messageEl = document.getElementById("message-action");
      try {
        await db.collection("vendeurs").doc(uid).update({ statut: "refuse" });
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Vendeur refusé.";
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      }
    }

    function chargerVendeurs() {
      db.collection("vendeurs").onSnapshot((snapshot) => {
        document.getElementById("nb-vendeurs").textContent = snapshot.size;
        const liste = document.getElementById("liste-vendeurs");
        if (snapshot.empty) {
          liste.innerHTML = "<p>Aucun vendeur pour l'instant.</p>";
          return;
        }
        liste.innerHTML = snapshot.docs
          .map((doc) => {
            const v = doc.data();
            const statutTexte =
              v.statut === "valide" ? '<span class="statut-valide">Validé</span>' :
              v.statut === "code_envoye" ? '<span class="statut-attente">Code envoyé</span>' :
              v.statut === "refuse" ? '<span class="statut-refuse">Refusé</span>' :
              '<span class="statut-attente">En attente</span>';
            const boutons =
              v.statut === "en_attente"
                ? `<button class="accepter" data-uid="${doc.id}">Accepter</button>
                   <button class="refuser" data-uid="${doc.id}">Refuser</button>`
                : "";
            return `<div class="ligne">
              <span><strong>${v.nomVendeur || "?"}</strong> — ${v.email || ""} — ${statutTexte}</span>
              ${boutons}
            </div>`;
          })
          .join("");

        liste.querySelectorAll("button.accepter").forEach((btn) => {
          btn.addEventListener("click", () => accepterVendeur(btn.dataset.uid));
        });
        liste.querySelectorAll("button.refuser").forEach((btn) => {
          btn.addEventListener("click", () => refuserVendeur(btn.dataset.uid));
        });
      });
    }

    function chargerProduits() {
      db.collection("produits").orderBy("dateAjout", "desc").onSnapshot((snapshot) => {
        document.getElementById("nb-produits").textContent = snapshot.size;
        const liste = document.getElementById("liste-produits-admin");
        if (snapshot.empty) {
          liste.innerHTML = "<p>Aucun produit pour l'instant.</p>";
          return;
        }
        liste.innerHTML = snapshot.docs
          .map((doc) => {
            const p = doc.data();
            return `<div class="ligne">
              <span>${p.nom} — ${Number(p.prix).toLocaleString("fr-FR")} F CFA — <em>${p.nomVendeur || ""}</em></span>
              <button data-id="${doc.id}">Supprimer</button>
            </div>`;
          })
          .join("");
        liste.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (confirm("Supprimer ce produit ?")) {
              await db.collection("produits").doc(btn.dataset.id).delete();
            }
          });
        });
      });
    }
  </script>

</body>
</html>
