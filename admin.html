<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #FAF6EE; color: #222; }
    header { background: #16213E; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    .nav-liens { display: flex; gap: 16px; align-items: center; }
    .nav-liens a { color: white; text-decoration: none; font-size: 0.9rem; }
    .nav-liens a:hover { text-decoration: underline; }
    #btn-deconnexion { background: none; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .conteneur { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .carte { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; max-width: 380px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 14px; }
    input { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    button { background: #16213E; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .message { font-size: 0.9rem; font-weight: bold; min-height: 20px; }

    .titre-section {
      margin-top: 34px;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .tableau-wrap {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead th {
      text-align: left;
      background: #F0EBDD;
      padding: 10px 12px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      border-bottom: 1px solid #ddd;
    }
    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: #FBF8F1;
    }

    .btn-petit {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      white-space: nowrap;
    }
    .btn-supprimer { background: #D6336C; }
    .btn-accepter { background: #0B6E6E; margin-right: 4px; }
    .btn-refuser { background: #888; }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-attente { background: #FEEBC8; color: #975A16; }
    .badge-valide { background: #C6F6D5; color: #22543D; }
    .badge-refuse { background: #FED7D7; color: #822727; }

    .statut-select {
      padding: 5px 6px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 0.82rem;
    }

    .liste-articles {
      margin: 0;
      padding-left: 16px;
    }

    .vide {
      padding: 16px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">MarketSenegal</a>
    <nav class="nav-liens">
      <a href="index.html">Accueil</a>
      <a href="vendeur.html">Devenir vendeur</a>
    </nav>
    <button id="btn-deconnexion" style="display:none;">Se déconnecter</button>
  </header>

  <div class="conteneur">

    <div id="bloc-connexion" class="carte">
      <h2>Connexion admin</h2>
      <form id="form-connexion">
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Mot de passe
          <input type="password" name="motdepasse" required>
        </label>
        <button type="submit">Se connecter</button>
      </form>
      <p class="message" id="message-connexion"></p>
    </div>

    <div id="bloc-admin" style="display:none;">
      <h2>Tableau de bord</h2>
      <p id="message-action" class="message"></p>

      <h3 class="titre-section">Vendeurs (<span id="nb-vendeurs">0</span>)</h3>
      <div class="tableau-wrap">
        <table>
          <thead>
            <tr>
              <th>Boutique</th>
              <th>Email</th>
              <th>WhatsApp</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-vendeurs"></tbody>
        </table>
      </div>

      <h3 class="titre-section">Produits publiés (<span id="nb-produits">0</span>)</h3>
      <div class="tableau-wrap">
        <table>
          <thead>
            <tr>
              <th>Produit</th>
              <th>Prix</th>
              <th>Vendeur</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-produits"></tbody>
        </table>
      </div>

      <h3 class="titre-section">Commandes (<span id="nb-commandes">0</span>)</h3>
      <div class="tableau-wrap">
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Livraison</th>
              <th>Articles</th>
              <th>Total</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-commandes"></tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    emailjs.init("tulYYMgHIeGkicpqU");

    const blocConnexion = document.getElementById("bloc-connexion");
    const blocAdmin = document.getElementById("bloc-admin");
    const btnDeconnexion = document.getElementById("btn-deconnexion");

    document.getElementById("form-connexion").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const messageEl = document.getElementById("message-connexion");
      try {
        await auth.signInWithEmailAndPassword(form.email.value, form.motdepasse.value);
      } catch (err) {
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Email ou mot de passe incorrect.";
      }
    });

    btnDeconnexion.addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged((user) => {
      if (user && user.uid === ADMIN_UID) {
        blocConnexion.style.display = "none";
        blocAdmin.style.display = "block";
        btnDeconnexion.style.display = "inline-block";
        chargerVendeurs();
        chargerProduits();
        chargerCommandes();
        verifierLienAcceptation();
      } else if (user && user.uid !== ADMIN_UID) {
        alert("Ce compte n'est pas administrateur.");
        auth.signOut();
      } else {
        blocConnexion.style.display = "block";
        blocAdmin.style.display = "none";
        btnDeconnexion.style.display = "none";
      }
    });

    function verifierLienAcceptation() {
      const params = new URLSearchParams(window.location.search);
      const uidAAccepter = params.get("accepter");
      if (uidAAccepter) {
        accepterVendeur(uidAAccepter);
      }
    }

    async function accepterVendeur(uid) {
      const messageEl = document.getElementById("message-action");
      messageEl.style.color = "#222";
      messageEl.textContent = "Validation en cours...";

      try {
        const doc = await db.collection("vendeurs").doc(uid).get();
        if (!doc.exists) {
          messageEl.style.color = "#D6336C";
          messageEl.textContent = "Vendeur introuvable.";
          return;
        }
        const data = doc.data();
        const code = String(Math.floor(100000 + Math.random() * 900000));

        await db.collection("vendeurs").doc(uid).update({
          statut: "code_envoye",
          codeConfirmation: code,
        });

        await emailjs.send("service_wkkglfl", "template_k5wz66g", {
          nom_vendeur: data.nomVendeur,
          email_vendeur: data.email,
          code: code,
        });

        messageEl.style.color = "green";
        messageEl.textContent = `Vendeur "${data.nomVendeur}" accepté, code envoyé !`;
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      }
    }

    async function refuserVendeur(uid) {
      if (!confirm("Refuser ce vendeur ? Il ne pourra pas publier de produits.")) return;
      const messageEl = document.getElementById("message-action");
      try {
        await db.collection("vendeurs").doc(uid).update({ statut: "refuse" });
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Vendeur refusé.";
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      }
    }

    function chargerVendeurs() {
      db.collection("vendeurs").onSnapshot((snapshot) => {
        document.getElementById("nb-vendeurs").textContent = snapshot.size;
        const corps = document.getElementById("corps-vendeurs");
        if (snapshot.empty) {
          corps.innerHTML = `<tr><td colspan="5" class="vide">Aucun vendeur pour l'instant.</td></tr>`;
          return;
        }
        corps.innerHTML = snapshot.docs
          .map((doc) => {
            const v = doc.data();
            const badge =
              v.statut === "valide" ? '<span class="badge badge-valide">Validé</span>' :
              v.statut === "code_envoye" ? '<span class="badge badge-attente">Code envoyé</span>' :
              v.statut === "refuse" ? '<span class="badge badge-refuse">Refusé</span>' :
              '<span class="badge badge-attente">En attente</span>';
            const actions =
              v.statut === "en_attente"
                ? `<button class="btn-petit btn-accepter" data-uid="${doc.id}" data-action="accepter">Accepter</button>
                   <button class="btn-petit btn-refuser" data-uid="${doc.id}" data-action="refuser">Refuser</button>`
                : "";
            return `<tr>
              <td><strong>${v.nomVendeur || "?"}</strong></td>
              <td>${v.email || ""}</td>
              <td>${v.whatsapp || ""}</td>
              <td>${badge}</td>
              <td>${actions}</td>
            </tr>`;
          })
          .join("");

        corps.querySelectorAll("button[data-action='accepter']").forEach((btn) => {
          btn.addEventListener("click", () => accepterVendeur(btn.dataset.uid));
        });
        corps.querySelectorAll("button[data-action='refuser']").forEach((btn) => {
          btn.addEventListener("click", () => refuserVendeur(btn.dataset.uid));
        });
      });
    }

    function chargerProduits() {
      db.collection("produits").orderBy("dateAjout", "desc").onSnapshot((snapshot) => {
        document.getElementById("nb-produits").textContent = snapshot.size;
        const corps = document.getElementById("corps-produits");
        if (snapshot.empty) {
          corps.innerHTML = `<tr><td colspan="4" class="vide">Aucun produit pour l'instant.</td></tr>`;
          return;
        }
        corps.innerHTML = snapshot.docs
          .map((doc) => {
            const p = doc.data();
            return `<tr>
              <td>${p.nom}</td>
              <td>${Number(p.prix).toLocaleString("fr-FR")} F CFA</td>
              <td><em>${p.nomVendeur || ""}</em></td>
              <td><button class="btn-petit btn-supprimer" data-id="${doc.id}">Supprimer</button></td>
            </tr>`;
          })
          .join("");
        corps.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (confirm("Supprimer ce produit ?")) {
              await db.collection("produits").doc(btn.dataset.id).delete();
            }
          });
        });
      });
    }

    const STATUTS_COMMANDE = ["en attente", "confirmée", "en livraison", "livrée"];

    function chargerCommandes() {
      db.collection("commandes").orderBy("dateCommande", "desc").onSnapshot((snapshot) => {
        document.getElementById("nb-commandes").textContent = snapshot.size;
        const corps = document.getElementById("corps-commandes");
        if (snapshot.empty) {
          corps.innerHTML = `<tr><td colspan="6" class="vide">Aucune commande pour l'instant.</td></tr>`;
          return;
        }
        corps.innerHTML = snapshot.docs
          .map((doc) => {
            const c = doc.data();
            const articles = (c.articles || [])
              .map((a) => `<li>${a.quantite}x ${a.nom} <em>(${a.nomVendeur || ""})</em></li>`)
              .join("");
            const options = STATUTS_COMMANDE.map(
              (s) => `<option value="${s}" ${s === c.statut ? "selected" : ""}>${s}</option>`
            ).join("");
            return `<tr>
              <td><strong>${c.client?.nom || "Client"}</strong><br><span style="color:#888;">${c.client?.telephone || ""}</span></td>
              <td>${c.client?.adresse || ""}, ${c.client?.ville || ""}</td>
              <td><ul class="liste-articles">${articles}</ul></td>
              <td>${Number(c.total || 0).toLocaleString("fr-FR")} F CFA</td>
              <td><select class="statut-select" data-id="${doc.id}">${options}</select></td>
              <td><button class="btn-petit btn-supprimer" data-suppr-cmd="${doc.id}">Supprimer</button></td>
            </tr>`;
          })
          .join("");

        corps.querySelectorAll(".statut-select").forEach((select) => {
          select.addEventListener("change", async () => {
            await db.collection("commandes").doc(select.dataset.id).update({ statut: select.value });
          });
        });

        corps.querySelectorAll("button[data-suppr-cmd]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (confirm("Supprimer cette commande ?")) {
              await db.collection("commandes").doc(btn.dataset.supprCmd).delete();
            }
          });
        });
      });
    }
  </script>

</body>
</html>
