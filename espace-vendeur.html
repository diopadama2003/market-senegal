<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal — Mon espace</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #FAF6EE; color: #222; }
    header { background: #16213E; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    .nav-liens { display: flex; gap: 16px; align-items: center; }
    .nav-liens a { color: white; text-decoration: none; font-size: 0.9rem; }
    .nav-liens a:hover { text-decoration: underline; }
    #btn-deconnexion { background: none; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .conteneur { max-width: 500px; margin: 30px auto; padding: 0 16px; }
    .carte { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 14px; }
    input, textarea { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; font-family: Arial, sans-serif; }
    button { background: #16213E; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 0.9rem; font-weight: bold; min-height: 20px; }
    .apercu-image { max-width: 120px; max-height: 120px; border-radius: 8px; margin-top: 8px; display: none; }
    .produit-ligne { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .produit-ligne button { background: #D6336C; padding: 5px 10px; font-size: 0.8rem; }
    .carte-commande {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .carte-commande .entete {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .carte-commande ul {
      margin: 6px 0;
      padding-left: 18px;
    }
    .badge-statut {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      background: #FEEBC8;
      color: #975A16;
    }
    .btn-suppr-commande {
      background: #D6336C;
      padding: 5px 10px;
      font-size: 0.78rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">MarketSenegal</a>
    <nav class="nav-liens">
      <a href="index.html">Accueil</a>
      <a href="vendeur.html">Devenir vendeur</a>
    </nav>
    <button id="btn-deconnexion">Se déconnecter</button>
  </header>

  <div class="conteneur">

    <div class="carte">
      <h2>Ajouter un produit</h2>
      <form id="form-produit">
        <label>Nom du produit
          <input type="text" name="nom" required>
        </label>
        <label>Prix (F CFA)
          <input type="number" name="prix" required min="0">
        </label>
        <label>Catégorie
          <input type="text" name="categorie" required placeholder="Alimentation, Vêtements, Parfums...">
        </label>
        <label>Photo du produit
          <input type="file" name="image" accept="image/*" required id="champ-image">
          <img id="apercu-image" class="apercu-image">
        </label>
        <button type="submit" id="btn-publier">Publier le produit</button>
      </form>
      <p class="message" id="message-produit"></p>
    </div>

    <div class="carte">
      <h2>Mes produits</h2>
      <div id="liste-mes-produits">Chargement...</div>
    </div>

    <div class="carte">
      <h2>Mes commandes</h2>
      <div id="liste-mes-commandes">Chargement...</div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const IMGBB_API_KEY = "205f355eb54fb27d85eb89fcb0ea69c5";

    let vendeurConnecte = null;

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "vendeur.html";
        return;
      }
      vendeurConnecte = user;

      const doc = await db.collection("vendeurs").doc(user.uid).get();
      const data = doc.data();
      const statut = data ? data.statut : "en_attente";

      if (statut === "en_attente") {
        document.querySelector(".carte").innerHTML = `
          <h2>Compte en attente</h2>
          <p>Ton compte est en attente de validation par l'administrateur.
          Tu recevras un email avec un code dès que ton compte sera accepté.
          Reviens sur cette page et actualise-la à ce moment-là.</p>
          <button id="btn-actualiser">Actualiser</button>
        `;
        document.getElementById("btn-actualiser").addEventListener("click", () => location.reload());
        return;
      }

      if (statut === "refuse") {
        document.querySelector(".carte").innerHTML = `
          <h2>Compte refusé</h2>
          <p>Ton inscription en tant que vendeur n'a pas été acceptée. Contacte l'administrateur pour plus d'informations.</p>
        `;
        return;
      }

      if (statut === "code_envoye") {
        document.querySelector(".carte").innerHTML = `
          <h2>Confirme ton compte</h2>
          <p>Un code de confirmation à 6 chiffres t'a été envoyé par email. Entre-le ici :</p>
          <form id="form-code">
            <label>Code de confirmation
              <input type="text" name="code" required maxlength="6">
            </label>
            <button type="submit">Confirmer</button>
          </form>
          <p class="message" id="message-code"></p>
        `;
        document.getElementById("form-code").addEventListener("submit", async (e) => {
          e.preventDefault();
          const codeSaisi = e.target.code.value.trim();
          const messageEl = document.getElementById("message-code");

          if (codeSaisi !== data.codeConfirmation) {
            messageEl.style.color = "#D6336C";
            messageEl.textContent = "Code incorrect.";
            return;
          }

          await db.collection("vendeurs").doc(user.uid).update({
            statut: "valide",
            codeConfirmation: firebase.firestore.FieldValue.delete(),
          });

          messageEl.style.color = "green";
          messageEl.textContent = "Compte confirmé !";
          setTimeout(() => location.reload(), 1000);
        });
        return;
      }

      chargerMesProduits();
      chargerMesCommandes();
    });

    document.getElementById("btn-deconnexion").addEventListener("click", () => {
      auth.signOut().then(() => (window.location.href = "vendeur.html"));
    });

    const champImage = document.getElementById("champ-image");
    const apercuImage = document.getElementById("apercu-image");
    champImage.addEventListener("change", () => {
      const fichier = champImage.files[0];
      if (fichier) {
        apercuImage.src = URL.createObjectURL(fichier);
        apercuImage.style.display = "block";
      }
    });

    async function envoyerPhoto(fichier) {
      const formData = new FormData();
      formData.append("image", fichier);
      const reponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData,
      });
      const data = await reponse.json();
      if (!data.success) throw new Error("Échec de l'envoi de la photo");
      return data.data.url;
    }

    document.getElementById("form-produit").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const messageEl = document.getElementById("message-produit");
      const boutonPublier = document.getElementById("btn-publier");
      const fichier = champImage.files[0];

      if (!fichier) {
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Choisis une photo.";
        return;
      }

      boutonPublier.disabled = true;
      messageEl.style.color = "#222";
      messageEl.textContent = "Envoi de la photo...";

      try {
        const lienImage = await envoyerPhoto(fichier);

        messageEl.textContent = "Publication du produit...";

        const vendeurDoc = await db.collection("vendeurs").doc(vendeurConnecte.uid).get();
        const vendeurData = vendeurDoc.data();

        await db.collection("produits").add({
          nom: form.nom.value,
          prix: Number(form.prix.value),
          categorie: form.categorie.value,
          image: lienImage,
          vendeurId: vendeurConnecte.uid,
          nomVendeur: vendeurData.nomVendeur,
          whatsappVendeur: vendeurData.whatsapp,
          dateAjout: firebase.firestore.FieldValue.serverTimestamp(),
        });

        messageEl.style.color = "green";
        messageEl.textContent = "Produit publié !";
        form.reset();
        apercuImage.style.display = "none";
      } catch (err) {
        console.error(err);
        messageEl.style.color = "#D6336C";
        messageEl.textContent = "Erreur : " + err.message;
      } finally {
        boutonPublier.disabled = false;
      }
    });

    function chargerMesProduits() {
      db.collection("produits")
        .where("vendeurId", "==", vendeurConnecte.uid)
        .onSnapshot((snapshot) => {
          const liste = document.getElementById("liste-mes-produits");
          if (snapshot.empty) {
            liste.innerHTML = "<p>Tu n'as pas encore ajouté de produit.</p>";
            return;
          }
          liste.innerHTML = snapshot.docs
            .map((doc) => {
              const p = doc.data();
              return `
              <div class="produit-ligne">
                <span>${p.nom} — ${Number(p.prix).toLocaleString("fr-FR")} F CFA</span>
                <button data-id="${doc.id}">Supprimer</button>
              </div>`;
            })
            .join("");

          liste.querySelectorAll("button[data-id]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (confirm("Supprimer ce produit ?")) {
                await db.collection("produits").doc(btn.dataset.id).delete();
              }
            });
          });
        });
    }

    function chargerMesCommandes() {
      db.collection("commandes")
        .where("vendeurIds", "array-contains", vendeurConnecte.uid)
        .orderBy("dateCommande", "desc")
        .onSnapshot((snapshot) => {
          const liste = document.getElementById("liste-mes-commandes");
          if (snapshot.empty) {
            liste.innerHTML = "<p>Aucune commande pour l'instant.</p>";
            return;
          }
          liste.innerHTML = snapshot.docs
            .map((doc) => {
              const c = doc.data();
              const mesArticles = (c.articles || []).filter((a) => a.vendeurId === vendeurConnecte.uid);
              const items = mesArticles.map((a) => `<li>${a.quantite}x ${a.nom}</li>`).join("");
              const sousTotal = mesArticles.reduce((s, a) => s + a.prix * a.quantite, 0);
              return `
              <div class="carte-commande">
                <div class="entete">
                  <span>${c.client?.nom || "Client"} — ${c.client?.telephone || ""}</span>
                  <span>${sousTotal.toLocaleString("fr-FR")} F CFA</span>
                </div>
                <div>Livraison : ${c.client?.adresse || ""}, ${c.client?.ville || ""}</div>
                <ul>${items}</ul>
                <span class="badge-statut">${c.statut || "en attente"}</span>
                <br>
                <button class="btn-suppr-commande" data-suppr-cmd="${doc.id}">Supprimer</button>
              </div>`;
            })
            .join("");

          liste.querySelectorAll("button[data-suppr-cmd]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (confirm("Supprimer cette commande ?")) {
                await db.collection("commandes").doc(btn.dataset.supprCmd).delete();
              }
            });
          });
        }, (erreur) => {
          console.error(erreur);
          document.getElementById("liste-mes-commandes").innerHTML =
            `<p style="color:#D6336C;">Erreur : ${erreur.message}</p>`;
        });
    }
  </script>

</body>
</html>
