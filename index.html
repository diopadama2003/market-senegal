<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #FAF6EE;
      color: #222;
    }

    header {
      background: #16213E;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    header h2 {
      margin: 0;
    }

    .nav-liens {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .nav-liens a {
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .nav-liens a:hover {
      text-decoration: underline;
    }

    header button {
      background: #F5A623;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      background: #1F2E52;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .toolbar {
      padding: 20px 30px 0;
    }

    #recherche {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid #ddd;
      background: #FAF6EE;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .chip.active {
      background: #16213E;
      color: white;
    }

    .etat {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    .grille-produits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .carte-produit {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
    }

    .carte-produit img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #eee;
      cursor: pointer;
    }

    .carte-produit-info {
      padding: 12px;
      cursor: pointer;
    }

    .carte-vendeur {
      font-size: 0.75rem;
      color: #0B6E6E;
      margin: 0 0 4px;
    }

    .prix {
      color: #D6336C;
      font-weight: bold;
      margin: 8px 0;
    }

    .carte-produit button {
      background: #16213E;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .boutons-produit {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-commander-direct {
      flex: 1;
      background: #D6336C;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .btn-ajouter {
      background: #16213E;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ===== Panier ===== */
    .panneau-panier {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: -4px 0 12px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      padding: 20px;
      box-sizing: border-box;
      z-index: 100;
      overflow-y: auto;
    }

    .panneau-panier.ouvert {
      right: 0;
    }

    .panneau-panier h3 {
      margin-top: 0;
    }

    .ligne-panier {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      font-size: 0.9rem;
    }

    .panier-total {
      margin-top: 16px;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
    }

    #fermer-panier {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }

    #btn-commander {
      width: 100%;
      background: #D6336C;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      cursor: pointer;
    }

    /* ===== Overlay + Modal commande ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    .overlay.visible {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 10px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      z-index: 110;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal.ouvert {
      display: block;
    }

    .modal h3 {
      margin-top: 0;
    }

    .modal label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .modal input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .modal button[type="submit"] {
      width: 100%;
      background: #16213E;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #fermer-modal {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }

    /* ===== Fiche produit (au clic sur la photo) ===== */
    .modal-produit {
      padding: 0;
      max-width: 360px;
      overflow: hidden;
    }
    .modal-produit-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .modal-produit-corps {
      padding: 18px 20px 20px;
    }
    .modal-produit-vendeur {
      font-size: 0.8rem;
      color: #0B6E6E;
      margin: 0 0 4px;
    }
    .modal-produit-nom {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 0 0 6px;
    }
    .modal-produit-prix {
      color: #D6336C;
      font-weight: bold;
      font-size: 1.2rem;
      margin: 0 0 14px;
    }
    .btn-detail-commander {
      display: block;
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-detail-panier {
      display: block;
      width: 100%;
      background: none;
      color: #16213E;
      border: 1px solid #16213E;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #fermer-modal-produit {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255,255,255,0.85);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 5;
    }
  </style>
</head>
<body>

  <header>
    <h2>MarketSenegal</h2>
    <nav class="nav-liens">
      <a href="index.html">Accueil</a>
      <a href="vendeur.html">Devenir vendeur</a>
    </nav>
    <button id="btn-panier">🧺 Panier (<span id="panier-count">0</span>)</button>
  </header>

  <section class="hero">
    <h1>Le marché sénégalais, dans ta poche</h1>
    <p>Trouve tout ce qu'on vend, où que tu sois, et fais-toi livrer.</p>
  </section>

  <div class="toolbar">
    <input type="search" id="recherche" placeholder="Chercher un produit... (ex: parfum, robe, riz)">
    <div class="categories" id="categories">
      <button class="chip active" data-cat="tous">Tous</button>
    </div>
  </div>

  <p class="etat" id="etat-chargement">Chargement des produits...</p>
  <div class="grille-produits" id="grille-produits"></div>

  <!-- Panneau panier -->
  <div class="panneau-panier" id="panneau-panier">
    <button id="fermer-panier">✕</button>
    <h3>Ton panier</h3>
    <div id="liste-panier"></div>
    <div class="panier-total">
      <span>Total</span>
      <span id="panier-total">0 F CFA</span>
    </div>
    <button id="btn-commander">Commander</button>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- Modal commande -->
  <div class="modal" id="modal-commande">
    <button id="fermer-modal">✕</button>
    <h3>Finaliser la commande</h3>
    <form id="form-commande">
      <label>Nom complet
        <input type="text" name="nom" required>
      </label>
      <label>Téléphone
        <input type="tel" name="telephone" placeholder="ex: 221771234567" required>
      </label>
      <label>Ville / Pays
        <input type="text" name="ville" required>
      </label>
      <label>Quartier / adresse
        <input type="text" name="adresse" required>
      </label>
      <button type="submit">Envoyer la commande</button>
    </form>
  </div>

  <!-- Fiche produit (photo + infos + actions) -->
  <div class="modal modal-produit" id="modal-produit" style="position: relative;">
    <button id="fermer-modal-produit">✕</button>
    <img id="produit-img" class="modal-produit-img" alt="">
    <div class="modal-produit-corps">
      <p class="modal-produit-vendeur" id="produit-vendeur"></p>
      <p class="modal-produit-nom" id="produit-nom"></p>
      <p class="modal-produit-prix" id="produit-prix"></p>
      <button class="btn-detail-commander" id="btn-detail-commander">📦 Commander</button>
      <button class="btn-detail-panier" id="btn-detail-panier">🧺 Ajouter au panier</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    let TOUS_LES_PRODUITS = [];
    let categorieActive = "tous";
    let termeRecherche = "";
    let panier = [];
    let articlesACommander = null;
    let produitAffiche = null;

    const grille = document.getElementById("grille-produits");
    const etatChargement = document.getElementById("etat-chargement");
    const zoneCategories = document.getElementById("categories");
    const champRecherche = document.getElementById("recherche");
    const panneauPanier = document.getElementById("panneau-panier");
    const overlay = document.getElementById("overlay");
    const listePanierEl = document.getElementById("liste-panier");
    const panierTotalEl = document.getElementById("panier-total");
    const panierCountEl = document.getElementById("panier-count");
    const modalCommande = document.getElementById("modal-commande");
    const modalProduit = document.getElementById("modal-produit");

    function formatFCFA(montant) {
      return Number(montant).toLocaleString("fr-FR") + " F CFA";
    }

    // Charger les produits depuis Firestore, en temps réel
    db.collection("produits").orderBy("dateAjout", "desc").onSnapshot(
      (snapshot) => {
        TOUS_LES_PRODUITS = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        construireCategories();
        afficherProduits();
        etatChargement.style.display = "none";
      },
      (erreur) => {
        console.error(erreur);
        etatChargement.textContent = "Erreur de chargement. Vérifie ta configuration Firebase.";
      }
    );

    function construireCategories() {
      const categories = ["tous", ...new Set(TOUS_LES_PRODUITS.map((p) => p.categorie).filter(Boolean))];
      zoneCategories.innerHTML = categories
        .map((c) => `<button class="chip ${c === categorieActive ? "active" : ""}" data-cat="${c}">${c === "tous" ? "Tous" : c}</button>`)
        .join("");
      zoneCategories.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          categorieActive = btn.dataset.cat;
          construireCategories();
          afficherProduits();
        });
      });
    }

    function afficherProduits() {
      let produits = TOUS_LES_PRODUITS;
      if (categorieActive !== "tous") {
        produits = produits.filter((p) => p.categorie === categorieActive);
      }
      if (termeRecherche.trim()) {
        const t = termeRecherche.toLowerCase();
        produits = produits.filter((p) => p.nom.toLowerCase().includes(t));
      }

      if (produits.length === 0) {
        grille.innerHTML = `<p class="etat">Aucun produit trouvé.</p>`;
        return;
      }

      grille.innerHTML = produits
        .map(
          (p) => `
        <div class="carte-produit">
          <img src="${p.image}" alt="${p.nom}" loading="lazy" class="ouvre-detail" data-id="${p.id}">
          <div class="carte-produit-info ouvre-detail" data-id="${p.id}">
            <p class="carte-vendeur">${p.nomVendeur || "Vendeur"}</p>
            <p>${p.nom}</p>
            <p class="prix">${formatFCFA(p.prix)}</p>
            <div class="boutons-produit">
              <button class="btn-commander-direct" data-id="${p.id}">Commander</button>
              <button class="btn-ajouter" data-id="${p.id}">🧺</button>
            </div>
          </div>
        </div>`
        )
        .join("");

      grille.querySelectorAll(".btn-ajouter").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          ajouterAuPanier(btn.dataset.id);
        });
      });

      grille.querySelectorAll(".btn-commander-direct").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          commanderDirect(btn.dataset.id);
        });
      });

      grille.querySelectorAll(".ouvre-detail").forEach((el) => {
        el.addEventListener("click", () => ouvrirDetailProduit(el.dataset.id));
      });
    }

    function ouvrirDetailProduit(id) {
      const produit = TOUS_LES_PRODUITS.find((p) => p.id === id);
      if (!produit) return;
      produitAffiche = produit;

      document.getElementById("produit-img").src = produit.image;
      document.getElementById("produit-vendeur").textContent = produit.nomVendeur || "Vendeur";
      document.getElementById("produit-nom").textContent = produit.nom;
      document.getElementById("produit-prix").textContent = formatFCFA(produit.prix);

      modalProduit.classList.add("ouvert");
      overlay.classList.add("visible");
    }

    document.getElementById("fermer-modal-produit").addEventListener("click", () => {
      modalProduit.classList.remove("ouvert");
      overlay.classList.remove("visible");
    });

    document.getElementById("btn-detail-commander").addEventListener("click", () => {
      if (!produitAffiche) return;
      modalProduit.classList.remove("ouvert");
      commanderDirect(produitAffiche.id);
    });

    document.getElementById("btn-detail-panier").addEventListener("click", () => {
      if (!produitAffiche) return;
      ajouterAuPanier(produitAffiche.id);
      modalProduit.classList.remove("ouvert");
    });

    champRecherche.addEventListener("input", (e) => {
      termeRecherche = e.target.value;
      afficherProduits();
    });

    // ===== Panier =====
    function ajouterAuPanier(id) {
      const produit = TOUS_LES_PRODUITS.find((p) => p.id === id);
      if (!produit) return;
      const ligne = panier.find((l) => l.id === id);
      if (ligne) {
        ligne.quantite += 1;
      } else {
        panier.push({
          id,
          nom: produit.nom,
          prix: Number(produit.prix),
          nomVendeur: produit.nomVendeur,
          whatsappVendeur: produit.whatsappVendeur,
          quantite: 1,
        });
      }
      afficherPanier();
      ouvrirPanier();
    }

    function afficherPanier() {
      const totalArticles = panier.reduce((s, l) => s + l.quantite, 0);
      panierCountEl.textContent = totalArticles;

      if (panier.length === 0) {
        listePanierEl.innerHTML = `<p class="etat">Ton panier est vide.</p>`;
      } else {
        listePanierEl.innerHTML = panier
          .map(
            (l) => `
          <div class="ligne-panier">
            <span>${l.quantite}x ${l.nom}</span>
            <strong>${formatFCFA(l.prix * l.quantite)}</strong>
          </div>`
          )
          .join("");
      }

      const total = panier.reduce((s, l) => s + l.prix * l.quantite, 0);
      panierTotalEl.textContent = formatFCFA(total);
    }

    function ouvrirPanier() {
      panneauPanier.classList.add("ouvert");
      overlay.classList.add("visible");
    }
    function fermerPanier() {
      panneauPanier.classList.remove("ouvert");
      overlay.classList.remove("visible");
    }

    document.getElementById("btn-panier").addEventListener("click", ouvrirPanier);
    document.getElementById("fermer-panier").addEventListener("click", fermerPanier);
    overlay.addEventListener("click", () => {
      fermerPanier();
      fermerModal();
      modalProduit.classList.remove("ouvert");
    });

    // ===== Commande =====
    document.getElementById("btn-commander").addEventListener("click", () => {
      if (panier.length === 0) return;
      articlesACommander = null;
      modalCommande.classList.add("ouvert");
      overlay.classList.add("visible");
    });

    function commanderDirect(id) {
      const produit = TOUS_LES_PRODUITS.find((p) => p.id === id);
      if (!produit) return;
      articlesACommander = [{
        id,
        nom: produit.nom,
        prix: Number(produit.prix),
        nomVendeur: produit.nomVendeur,
        whatsappVendeur: produit.whatsappVendeur,
        quantite: 1,
      }];
      modalCommande.classList.add("ouvert");
      overlay.classList.add("visible");
    }

    document.getElementById("fermer-modal").addEventListener("click", fermerModal);
    function fermerModal() {
      modalCommande.classList.remove("ouvert");
    }

    document.getElementById("form-commande").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;

      const articles = articlesACommander || panier;

      const client = {
        nom: form.nom.value,
        telephone: form.telephone.value,
        ville: form.ville.value,
        adresse: form.adresse.value,
      };
      const total = articles.reduce((s, l) => s + l.prix * l.quantite, 0);

      try {
        await db.collection("commandes").add({
          client,
          articles,
          total,
          statut: "en attente",
          dateCommande: firebase.firestore.FieldValue.serverTimestamp(),
        });

        const parVendeur = {};
        articles.forEach((l) => {
          const cle = l.whatsappVendeur || "inconnu";
          if (!parVendeur[cle]) parVendeur[cle] = { nomVendeur: l.nomVendeur, articles: [] };
          parVendeur[cle].articles.push(l);
        });

        Object.entries(parVendeur).forEach(([whatsapp, groupe]) => {
          if (whatsapp === "inconnu") return;
          const recap = groupe.articles.map((l) => `- ${l.quantite}x ${l.nom} (${formatFCFA(l.prix)})`).join("\n");
          const sousTotal = groupe.articles.reduce((s, l) => s + l.prix * l.quantite, 0);
          const message =
            `Nouvelle commande MarketSenegal\n` +
            `Client: ${client.nom} (${client.telephone})\n` +
            `Livraison: ${client.adresse}, ${client.ville}\n\n` +
            `Articles:\n${recap}\n\n` +
            `Sous-total: ${formatFCFA(sousTotal)}`;
          window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`, "_blank");
        });

        if (!articlesACommander) {
          panier = [];
          afficherPanier();
        }
        articlesACommander = null;
        form.reset();
        fermerModal();
        fermerPanier();
        alert("Commande envoyée !");
      } catch (err) {
        console.error(err);
        alert("Erreur lors de l'envoi de la commande.");
      }
    });
  </script>

</body>
</html>
