
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSenegal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #FAF6EE;
      color: #222;
    }

    header {
      background: #16213E;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    header h2 {
      margin: 0;
    }

    header button {
      background: #F5A623;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      background: #1F2E52;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .toolbar {
      padding: 20px 30px 0;
    }

    #recherche {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid #ddd;
      background: #FAF6EE;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .chip.active {
      background: #16213E;
      color: white;
    }

    .grille-produits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .carte-produit {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
    }

    .carte-produit img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .carte-produit-info {
      padding: 12px;
    }

    .prix {
      color: #D6336C;
      font-weight: bold;
      margin: 8px 0;
    }

    .carte-produit button {
      background: #16213E;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* ===== Panier ===== */
    .panneau-panier {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: -4px 0 12px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      padding: 20px;
      box-sizing: border-box;
      z-index: 100;
    }

    .panneau-panier.ouvert {
      right: 0;
    }

    .panneau-panier h3 {
      margin-top: 0;
    }

    .ligne-panier {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      font-size: 0.9rem;
    }

    .panier-total {
      margin-top: 16px;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
    }

    #fermer-panier {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <header>
    <h2>MarketSenegal</h2>
    <button id="btn-panier">🧺 Panier (<span id="panier-count">0</span>)</button>
  </header>

  <section class="hero">
    <h1>Le marché sénégalais, dans ta poche</h1>
    <p>Trouve tout ce qu'on vend au Sénégal, et fais-toi livrer.</p>
  </section>

  <div class="toolbar">
    <input type="search" id="recherche" placeholder="Chercher un produit... (ex: parfum, robe, riz)">
    <div class="categories">
      <button class="chip active">Tous</button>
      <button class="chip">Alimentation</button>
      <button class="chip">Vêtements</button>
      <button class="chip">Parfums</button>
      <button class="chip">Électronique</button>
    </div>
  </div>

  <div class="grille-produits">

    <div class="carte-produit" data-nom="Sac de riz 25kg" data-prix="12500">
      <img src="https://placehold.co/300x200?text=Riz" alt="Riz">
      <div class="carte-produit-info">
        <p>Sac de riz 25kg</p>
        <p class="prix">12 500 F CFA</p>
        <button class="btn-ajouter">Ajouter</button>
      </div>
    </div>

    <div class="carte-produit" data-nom="Chaussures homme" data-prix="8000">
      <img src="https://placehold.co/300x200?text=Chaussures" alt="Chaussures">
      <div class="carte-produit-info">
        <p>Chaussures homme</p>
        <p class="prix">8 000 F CFA</p>
        <button class="btn-ajouter">Ajouter</button>
      </div>
    </div>

    <div class="carte-produit" data-nom="Téléphone Android" data-prix="65000">
      <img src="https://placehold.co/300x200?text=Telephone" alt="Téléphone">
      <div class="carte-produit-info">
        <p>Téléphone Android</p>
        <p class="prix">65 000 F CFA</p>
        <button class="btn-ajouter">Ajouter</button>
      </div>
    </div>

  </div>

  <!-- Panneau panier -->
  <div class="panneau-panier" id="panneau-panier">
    <button id="fermer-panier">✕</button>
    <h3>Ton panier</h3>
    <div id="liste-panier"></div>
    <div class="panier-total">
      <span>Total</span>
      <span id="panier-total">0 F CFA</span>
    </div>
  </div>

  <script>
    let panier = [];

    const panneauPanier = document.getElementById("panneau-panier");
    const listePanier = document.getElementById("liste-panier");
    const panierCount = document.getElementById("panier-count");
    const panierTotal = document.getElementById("panier-total");

    document.getElementById("btn-panier").addEventListener("click", () => {
      panneauPanier.classList.add("ouvert");
    });

    document.getElementById("fermer-panier").addEventListener("click", () => {
      panneauPanier.classList.remove("ouvert");
    });

    document.querySelectorAll(".btn-ajouter").forEach(btn => {
      btn.addEventListener("click", () => {
        const carte = btn.closest(".carte-produit");
        const nom = carte.dataset.nom;
        const prix = Number(carte.dataset.prix);
        panier.push({ nom, prix });
        afficherPanier();
        panneauPanier.classList.add("ouvert");
      });
    });

    function afficherPanier() {
      panierCount.textContent = panier.length;
      listePanier.innerHTML = panier.map(p => `
        <div class="ligne-panier">
          <span>${p.nom}</span>
          <span>${p.prix.toLocaleString("fr-FR")} F CFA</span>
        </div>
      `).join("");
      const total = panier.reduce((s, p) => s + p.prix, 0);
      panierTotal.textContent = total.toLocaleString("fr-FR") + " F CFA";
    }
  </script>

</body>
</html>
